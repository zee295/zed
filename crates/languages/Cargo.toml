[package]
name = "languages"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
default = ["native-adapters", "python-support"]
native-adapters = []
python-support = [
    "native-adapters",
    "dep:pet",
    "dep:pet-conda",
    "dep:pet-core",
    "dep:pet-fs",
    "dep:pet-poetry",
    "dep:pet-reporter",
    "dep:pet-virtualenv",
]
test-support = [
    "load-grammars",
    "python-support",
]
load-grammars = [
    "grammars/load-grammars",
    "native-adapters",
    "python-support",
    "tree-sitter",
    "tree-sitter-gitcommit",
]

[dependencies]
anyhow.workspace = true
async-compression.workspace = true
async-fs.workspace = true
async-tar.workspace = true
async-trait.workspace = true
chrono.workspace = true
collections.workspace = true
futures.workspace = true
globset.workspace = true
gpui.workspace = true
grammars.workspace = true
http_client = { workspace = true, features = ["github-download"] }
itertools.workspace = true
json_schema_store.workspace = true
language.workspace = true
log.workspace = true
lsp.workspace = true
node_runtime.workspace = true
parking_lot.workspace = true
pet-conda = { workspace = true, optional = true }
pet-core = { workspace = true, optional = true }
pet-fs = { workspace = true, optional = true }
pet-poetry = { workspace = true, optional = true }
pet-reporter = { workspace = true, optional = true }
pet-virtualenv = { workspace = true, optional = true }
pet = { workspace = true, optional = true }
project.workspace = true
regex.workspace = true
rope.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
settings.workspace = true
smallvec.workspace = true
semver.workspace = true
smol.workspace = true
snippet.workspace = true
task.workspace = true
terminal.workspace = true
theme.workspace = true
tree-sitter = { workspace = true, optional = true , features = ["wasm"] }
tree-sitter-gitcommit = { workspace = true, optional = true }
url.workspace = true
util.workspace = true

[dev-dependencies]
fs = { workspace = true, features = ["test-support"] }
pretty_assertions.workspace = true
tempfile = { workspace = true}
settings = { workspace = true, features = ["test-support"] }
theme = { workspace = true, features = ["test-support"] }
tree-sitter-bash.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-css.workspace = true
tree-sitter-go.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter = { workspace = true, features = ["wasm"] }
unindent.workspace = true
