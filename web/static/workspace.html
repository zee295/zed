<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Zed Remote - Workspace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            background: #11111b;
            color: #cdd6f4;
            font-family: system-ui, sans-serif;
        }
        body {
            padding-top: env(safe-area-inset-top);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
        }
        canvas {
            display: block;
            overscroll-behavior: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #boot {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        #zed-external-link-prompt {
            position: fixed;
            z-index: 2147483647;
            top: 12px;
            right: 12px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            align-items: center;
            gap: 10px;
            width: min(440px, calc(100vw - 24px));
            min-height: 48px;
            padding: 8px 10px 8px 14px;
            border: 1px solid #4b5363;
            border-radius: 6px;
            background: #292d35;
            box-shadow: 0 8px 24px rgb(0 0 0 / 35%);
            color: #e6e9ef;
            font-size: 14px;
        }
        #zed-external-link-prompt span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #zed-external-link-prompt a {
            padding: 6px 10px;
            border-radius: 4px;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            text-decoration: none;
        }
        #zed-external-link-prompt button {
            width: 30px;
            height: 30px;
            border: 0;
            background: transparent;
            color: #c9ced8;
            cursor: pointer;
            font-size: 22px;
            line-height: 1;
        }
        #zed-oauth-dialog {
            position: fixed; inset: 0; margin: auto;
            width: min(440px, calc(100vw - 32px)); box-sizing: border-box;
            padding: 20px; color: #e4e4e7; background: #292c33;
            border: 1px solid #555963; border-radius: 6px;
            font: 14px/1.5 system-ui, sans-serif;
        }
        #zed-oauth-dialog::backdrop { background: #0008; }
        #zed-oauth-dialog h2 { margin: 0 0 8px; font-size: 18px; }
        #zed-oauth-dialog input {
            display: block; width: 100%; box-sizing: border-box; margin: 12px 0;
            padding: 8px; color: inherit; background: #202329;
            border: 1px solid #626773; border-radius: 4px; font: inherit;
        }
        #zed-oauth-dialog .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
        #zed-oauth-dialog button, #zed-oauth-dialog a {
            color: inherit; font: inherit; padding: 6px 12px;
        }
        #zed-oauth-dialog button { background: #383d46; border: 1px solid #626773; border-radius: 4px; cursor: pointer; }
        #zed-oauth-dialog [role="alert"] { color: #ffa7a7; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <div id="boot">Starting Zed workspace...</div>
    <script type="module">
        import init from "./zed_web_workspace.js";

        const allowedExternalProtocols = new Set(["http:", "https:", "mailto:"]);
        const oauthCallbacks = new Map();

        globalThis.__zedCancelOAuthCallback = (redirectUri) => oauthCallbacks.get(redirectUri)?.cancel();
        globalThis.__zedWaitOAuthCallback = (redirectUri) => {
            const redirect = new URL(redirectUri);
            if (redirect.protocol !== "http:" || !["localhost", "127.0.0.1", "[::1]"].includes(redirect.hostname) || !redirect.port) {
                return Promise.reject(new Error("Invalid sign-in redirect"));
            }
            oauthCallbacks.get(redirectUri)?.cancel();
            return new Promise((resolve, reject) => {
                let dialog;
                let timer;
                const finish = (error, query) => {
                    clearTimeout(timer);
                    oauthCallbacks.delete(redirectUri);
                    dialog?.remove();
                    if (error) reject(new Error(error)); else resolve(query);
                };
                const pending = {
                    cancel: () => finish("Sign-in canceled"),
                    open: (authorizationUrl) => {
                        if (dialog) return;
                        // A registered loopback redirect cannot be changed to the remote host.
                        // Let the user relay it without exposing a listener on their device.
                        document.getElementById("zed-oauth-dialog")?.dispatchEvent(new Event("cancel", {cancelable: true}));
                        dialog = document.createElement("dialog");
                        dialog.id = "zed-oauth-dialog";
                        dialog.setAttribute("aria-label", "Complete provider sign-in");
                        const title = document.createElement("h2");
                        title.textContent = "Complete sign-in";
                        const description = document.createElement("p");
                        description.textContent = "After signing in, paste the full localhost URL from the browser address bar here. The localhost page may not open on this device.";
                        const form = document.createElement("form");
                        const input = document.createElement("input");
                        input.type = "url";
                        input.required = true;
                        input.autocomplete = "off";
                        input.spellcheck = false;
                        input.placeholder = `${redirect.origin}${redirect.pathname}?...`;
                        input.setAttribute("aria-label", "Sign-in callback URL");
                        const error = document.createElement("p");
                        error.setAttribute("role", "alert");
                        const actions = document.createElement("div");
                        actions.className = "actions";
                        const open = document.createElement("a");
                        open.href = authorizationUrl.href;
                        open.target = "_blank";
                        open.rel = "noopener noreferrer";
                        open.textContent = "Open Sign In";
                        const cancel = document.createElement("button");
                        cancel.type = "button";
                        cancel.textContent = "Cancel";
                        cancel.addEventListener("click", pending.cancel);
                        const submit = document.createElement("button");
                        submit.type = "submit";
                        submit.textContent = "Continue";
                        actions.append(open, cancel, submit);
                        form.append(input, error, actions);
                        form.addEventListener("submit", (event) => {
                            event.preventDefault();
                            try {
                                const callback = new URL(input.value.trim());
                                if (callback.origin !== redirect.origin || callback.pathname !== redirect.pathname || callback.username || callback.password) {
                                    throw new Error("Paste the callback URL for this sign-in attempt.");
                                }
                                const state = authorizationUrl.searchParams.get("state");
                                if (state && callback.searchParams.get("state") !== state) {
                                    throw new Error("The sign-in state does not match. Try signing in again.");
                                }
                                if (!callback.searchParams.has("error") && (state
                                    ? !callback.searchParams.get("code")
                                    : !(callback.searchParams.get("user_id") && callback.searchParams.get("access_token")))) {
                                    throw new Error("The callback URL is missing sign-in details.");
                                }
                                finish(null, callback.search.slice(1));
                            } catch (failure) { error.textContent = failure.message; }
                        });
                        dialog.addEventListener("cancel", (event) => { event.preventDefault(); pending.cancel(); });
                        dialog.append(title, description, form);
                        document.body.append(dialog);
                        dialog.showModal();
                        open.focus();
                    },
                };
                oauthCallbacks.set(redirectUri, pending);
                timer = setTimeout(() => finish("Sign-in expired"), 120000);
            });
        };

        function showExternalLinkPrompt(url) {
            document.getElementById("zed-external-link-prompt")?.remove();

            const prompt = document.createElement("div");
            prompt.id = "zed-external-link-prompt";
            prompt.setAttribute("role", "dialog");
            prompt.setAttribute("aria-label", "Open external link");

            const label = document.createElement("span");
            label.textContent = url.protocol === "mailto:"
                ? url.href
                : `Open ${url.host}`;
            label.title = url.href;

            const link = document.createElement("a");
            link.href = url.href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "Open";
            link.addEventListener("click", () => prompt.remove(), { once: true });

            const close = document.createElement("button");
            close.type = "button";
            close.setAttribute("aria-label", "Close");
            close.textContent = "\u00d7";
            close.addEventListener("click", () => prompt.remove(), { once: true });

            prompt.append(label, link, close);
            document.body.append(prompt);
            link.focus();
        }

        globalThis.__zedOpenExternalUrl = (rawUrl) => {
            let url;
            try {
                url = new URL(String(rawUrl), window.location.href);
            } catch (error) {
                console.warn("Zed refused an invalid external URL", error);
                return false;
            }
            if (!allowedExternalProtocols.has(url.protocol)) {
                console.warn(`Zed refused external URL protocol ${url.protocol}`);
                return false;
            }

            let redirectUri = url.searchParams.get("redirect_uri");
            if (!redirectUri && ["zed.dev", "staging.zed.dev"].includes(url.hostname) && url.pathname === "/native_app_signin") {
                redirectUri = `http://127.0.0.1:${url.searchParams.get("native_app_port")}/`;
            }
            const oauth = oauthCallbacks.get(redirectUri);
            if (oauth) {
                oauth.open(url);
                const opened = window.open(url.href, "_blank");
                if (opened) opened.opener = null;
                return Boolean(opened);
            }

            const opened = window.open(url.href, "_blank");
            if (opened) {
                opened.opener = null;
                return true;
            }

            showExternalLinkPrompt(url);
            return false;
        };

        try {
            await init();
            document.getElementById("boot")?.remove();
        } catch (error) {
            console.error(error);
            const boot = document.getElementById("boot");
            if (boot) boot.textContent = `Failed to start Zed: ${error}`;
        }
    </script>
</body>
</html>
