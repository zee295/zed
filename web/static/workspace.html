<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zed Remote - Workspace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #11111b;
            color: #cdd6f4;
            font-family: system-ui, sans-serif;
        }
        canvas { display: block; }
        #boot {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="boot">Starting Zed workspace...</div>
    <script type="module">
        import init from "./zed_web_workspace.js";

        try {
            await init();
            document.getElementById("boot")?.remove();
        } catch (error) {
            console.error(error);
            const boot = document.getElementById("boot");
            if (boot) boot.textContent = `Failed to start Zed: ${error}`;
        }
    </script>
</body>
</html>
